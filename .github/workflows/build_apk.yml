name: Build Flash2Mart Admin APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure Gradle Repositories
        run: |
          mkdir -p ~/.gradle/init.d
          cat << 'GRADLE' > ~/.gradle/init.d/repos.gradle
          beforeSettings { settings ->
              settings.pluginManagement {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
          }
          allprojects {
              buildscript {
                  repositories {
                      mavenCentral()
                      google()
                      gradlePluginPortal()
                  }
              }
              repositories {
                  mavenCentral()
                  google()
                  gradlePluginPortal()
              }
          }
          GRADLE

      - name: Get dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK for Mobile Download
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/flash2mart-admin-release.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flash2mart-admin-release-v1.0.${{ github.run_number }}
          path: build/app/outputs/flutter-apk/flash2mart-admin-release.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/flash2mart-admin-release.apk
          tag_name: release-${{ github.ref_name }}-${{ github.run_number }}
          name: Flash2Mart Admin (${{ github.ref_name }} #${{ github.run_number }})
          body: |
            🚀 Automatic Release for Flash2Mart Admin
            • Branch: `${{ github.ref_name }}`
            • APK: `flash2mart-admin-release.apk`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
